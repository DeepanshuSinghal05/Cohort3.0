<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 id="title">Welcome</h1>

    <button id="btn">Change Color</button>

    <input type="text" id="username">
    <button id="btn2">Show</button>
    <p id="output"></p>

    <p id="message">Hello World</p>
    <button id="btn3">Toggle</button>

    <input type="text" placeholder="Enter the fruit name you want to add in the list" id="fruit-inp">
    <ul id="list">
        <li>Apple</li>
       </ul>
       <button id="fruit-btn">Add Fruit</button>
    </ul>

    <div class="card">
        <h2>JavaScript</h2>
        <button id="del">Delete</button>
    </div>

    <h1>Count - <span>0</span></h1>
    <button id="add-c">+</button>
    <button id="sub-c">-</button>

    <div>
        <input id="cId" type="text">
        <p>Characters : <span id="cCount">0</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
